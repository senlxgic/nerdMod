name: Build nerdMod

on:
  workflow_dispatch:
  push:
    branches:
      - nerdmod-dev

permissions:
  contents: read

jobs:
  build:
    name: Build with devkitARM (pinned 20241104)
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:20241104

    env:
      BASELINE_COMMIT: 68d04c1a621a8d330e7233efcfcb93c94b30a3a6

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure Git
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify nerdMod baseline
        shell: bash
        run: |
          set -euxo pipefail

          echo "Current commit:"
          git rev-parse HEAD

          echo
          echo "Expected nerdMod baseline:"
          echo "$BASELINE_COMMIT"

          echo
          echo "Verify baseline commit exists:"
          git cat-file -e "${BASELINE_COMMIT}^{commit}"

          echo
          echo "Verify current branch descends from baseline:"
          git merge-base --is-ancestor "$BASELINE_COMMIT" HEAD

          echo
          echo "Submodules:"
          git submodule status

          echo
          echo "Application-source changes relative to baseline:"
          git diff --stat "$BASELINE_COMMIT" -- . ':(exclude).github'

      - name: Install build dependencies from pinned Debian snapshot
        shell: bash
        run: |
          set -euxo pipefail

          # Use a historical Debian snapshot matching the era
          # of devkitpro/devkitarm:20241104.
          cat > /etc/apt/nerdmod-sources.list <<'EOF'
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20241104T000000Z/ bullseye main
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20241104T000000Z/ bullseye-security main
          EOF

          echo "=== nerdMod APT sources ==="
          cat /etc/apt/nerdmod-sources.list
          echo "============================"

          # Remove old package metadata baked into the container.
          rm -rf /var/lib/apt/lists/*
          apt-get clean

          # Force APT to use ONLY our historical source list.
          APT_ARGS=(
            -o Acquire::Check-Valid-Until=false
            -o Dir::Etc::sourcelist=/etc/apt/nerdmod-sources.list
            -o Dir::Etc::sourceparts=-
          )

          apt-get "${APT_ARGS[@]}" update

          DEBIAN_FRONTEND=noninteractive \
          apt-get "${APT_ARGS[@]}" install \
            -y \
            --no-install-recommends \
            p7zip-full \
            python \
            curl \
            ca-certificates

      - name: Download TWiLight manual pages
        shell: bash
        run: |
          set -euxo pipefail

          cd manual/nitrofiles

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --output pages.7z \
            https://github.com/DS-Homebrew/twilight-manual/releases/download/pages/pages.7z

          7z x -y pages.7z
          rm pages.7z

      - name: Show toolchain information
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== devkitARM ==="
          "${DEVKITARM}/bin/arm-none-eabi-gcc" --version || true

          echo
          echo "=== Python ==="
          python --version || true

          echo
          echo "=== 7-Zip ==="
          7z | head -n 4 || true

          echo
          echo "=== Git ==="
          git --version || true

      - name: Build nerdMod baseline
        shell: bash
        run: |
          set -euxo pipefail

          START_TIME=$(date +%s)

          make package 2>&1 | tee build.log

          END_TIME=$(date +%s)
          BUILD_SECONDS=$((END_TIME - START_TIME))

          echo "BUILD_SECONDS=$BUILD_SECONDS" >> "$GITHUB_ENV"

          echo
          echo "Build completed in ${BUILD_SECONDS} seconds."

      - name: Verify build output
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -d "7zfile" ]; then
            echo "ERROR: make package did not produce 7zfile/"
            exit 1
          fi

          echo "=== Generated BOOT.NDS / SRLDR files ==="

          find 7zfile \
            -type f \
            \( -name "*.srldr" -o -name "BOOT.NDS" \) \
            -exec stat --printf='%s bytes  %n\n' {} \; \
            | sort -k3

      - name: Generate SHA-256 hashes
        shell: bash
        run: |
          set -euxo pipefail

          find 7zfile \
            -type f \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > SHA256SUMS.txt

      - name: Count build warnings and errors
        if: always()
        shell: bash
        run: |
          set +e

          if [ -f build.log ]; then
            WARNINGS=$(grep -Eic 'warning:' build.log || true)
            ERRORS=$(grep -Eic 'error:' build.log || true)
          else
            WARNINGS="unknown"
            ERRORS="unknown"
          fi

          echo "WARNING_COUNT=$WARNINGS" >> "$GITHUB_ENV"
          echo "ERROR_COUNT=$ERRORS" >> "$GITHUB_ENV"

      - name: Create build summary
        if: always()
        shell: bash
        run: |
          {
            echo "# nerdMod baseline build"
            echo
            echo "## Source"
            echo
            echo "- Current commit: \`${GITHUB_SHA}\`"
            echo "- Baseline: \`${BASELINE_COMMIT}\`"
            echo "- Container: \`devkitpro/devkitarm:20241104\`"
            echo
            echo "## Build"
            echo
            echo "- Duration: \`${BUILD_SECONDS:-unknown} seconds\`"
            echo "- Warning count: \`${WARNING_COUNT:-unknown}\`"
            echo "- Error count: \`${ERROR_COUNT:-unknown}\`"
            echo
            echo "## Application source diff vs baseline"
            echo
            echo '```text'

            git diff --stat \
              "$BASELINE_COMMIT" \
              -- . ':(exclude).github' \
              || true

            echo '```'
            echo
            echo "## Important binaries"
            echo
            echo '```text'

            if [ -d 7zfile ]; then
              find 7zfile \
                -type f \
                \( -name "*.srldr" -o -name "BOOT.NDS" \) \
                -exec stat --printf='%s bytes  %n\n' {} \; \
                | sort -k3
            else
              echo "No 7zfile directory was produced."
            fi

            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload nerdMod baseline
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nerdMod-baseline-v27.24.1
          path: |
            7zfile/
            SHA256SUMS.txt
            build.log
          if-no-files-found: error
          retention-days: 14
