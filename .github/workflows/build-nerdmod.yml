name: Build nerdMod

on:
  workflow_dispatch:
  push:
    branches:
      - nerdmod-dev

jobs:
  build:
    name: Build with devkitARM (pinned 20241104)
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:20241104

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure Git
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify baseline
        shell: bash
        run: |
          set -euxo pipefail

          echo "Current commit:"
          git rev-parse HEAD

          echo "Expected nerdMod baseline:"
          echo "68d04c1a621a8d330e7233efcfcb93c94b30a3a6"

          echo
          echo "Submodules:"
          git submodule status

          echo
          echo "Application-source changes relative to v27.24.1:"
          git diff --stat v27.24.1 -- . ':(exclude).github'

      - name: Configure archived Debian repositories
        shell: bash
        run: |
          set -euxo pipefail

          cat > /etc/apt/sources.list <<'EOF'
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20241104T000000Z/ bullseye main
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20241104T000000Z/ bullseye-security main
          EOF

          rm -rf /var/lib/apt/lists/*

          apt-get \
            -o Acquire::Check-Valid-Until=false \
            update

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail

          DEBIAN_FRONTEND=noninteractive \
          apt-get \
            -o Acquire::Check-Valid-Until=false \
            install -y --no-install-recommends \
            p7zip-full \
            python \
            curl \
            ca-certificates

      - name: Download TWiLight manual pages
        shell: bash
        run: |
          set -euxo pipefail

          cd manual/nitrofiles

          curl \
            --fail \
            --location \
            --retry 3 \
            --output pages.7z \
            https://github.com/DS-Homebrew/twilight-manual/releases/download/pages/pages.7z

          7z x -y pages.7z
          rm pages.7z

      - name: Show toolchain information
        shell: bash
        run: |
          set -euxo pipefail

          echo "devkitARM:"
          ${DEVKITARM}/bin/arm-none-eabi-gcc --version || true

          echo
          echo "Python:"
          python --version || true

          echo
          echo "7-Zip:"
          7z | head -n 3 || true

      - name: Build nerdMod baseline
        shell: bash
        run: |
          set -euxo pipefail

          START_TIME=$(date +%s)

          make package 2>&1 | tee build.log

          END_TIME=$(date +%s)
          BUILD_SECONDS=$((END_TIME - START_TIME))

          echo "BUILD_SECONDS=$BUILD_SECONDS" >> "$GITHUB_ENV"
          echo "Build completed in ${BUILD_SECONDS} seconds."

      - name: Verify build output
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -d "7zfile" ]; then
            echo "ERROR: 7zfile directory was not produced."
            exit 1
          fi

          echo "Generated binaries:"
          find 7zfile \
            -type f \
            \( -name "*.srldr" -o -name "BOOT.NDS" \) \
            -exec stat --printf='%s bytes  %n\n' {} \; \
            | sort -k3

      - name: Generate SHA-256 hashes
        shell: bash
        run: |
          set -euxo pipefail

          find 7zfile -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > SHA256SUMS.txt

      - name: Count build warnings and errors
        if: always()
        shell: bash
        run: |
          WARNINGS=$(grep -Eic 'warning:' build.log 2>/dev/null || true)
          ERRORS=$(grep -Eic 'error:' build.log 2>/dev/null || true)

          echo "WARNING_COUNT=$WARNINGS" >> "$GITHUB_ENV"
          echo "ERROR_COUNT=$ERRORS" >> "$GITHUB_ENV"

      - name: Create build summary
        if: always()
        shell: bash
        run: |
          {
            echo "# nerdMod baseline build"
            echo
            echo "## Source"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Baseline: \`v27.24.1\`"
            echo "- Baseline commit: \`68d04c1a621a8d330e7233efcfcb93c94b30a3a6\`"
            echo "- Container: \`devkitpro/devkitarm:20241104\`"
            echo
            echo "## Build"
            echo
            echo "- Duration: \`${BUILD_SECONDS:-unknown} seconds\`"
            echo "- Compiler warnings: \`${WARNING_COUNT:-unknown}\`"
            echo "- Compiler errors: \`${ERROR_COUNT:-unknown}\`"
            echo
            echo "## Important binaries"
            echo
            echo '```text'

            if [ -d 7zfile ]; then
              find 7zfile \
                -type f \
                \( -name "*.srldr" -o -name "BOOT.NDS" \) \
                -exec stat --printf='%s bytes  %n\n' {} \; \
                | sort -k3
            else
              echo "No 7zfile directory produced."
            fi

            echo '```'
            echo
            echo "## Application diff vs upstream baseline"
            echo
            echo '```text'
            git diff --stat v27.24.1 -- . ':(exclude).github' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload nerdMod baseline
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nerdMod-baseline-v27.24.1
          path: |
            7zfile/
            SHA256SUMS.txt
            build.log
          if-no-files-found: error
          retention-days: 14
