name: Build nerdMod

on:
  workflow_dispatch:
  push:
    branches:
      - nerdmod-dev

permissions:
  contents: read

jobs:
  build:
    name: Build with devkitARM (pinned 20241104)
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:20241104

    env:
      BASELINE_COMMIT: 68d04c1a621a8d330e7233efcfcb93c94b30a3a6

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure Git
        shell: bash
        run: |
          set -euxo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify nerdMod baseline
        shell: bash
        run: |
          set -euxo pipefail

          echo "Current commit:"
          git rev-parse HEAD

          echo
          echo "Expected nerdMod baseline:"
          echo "$BASELINE_COMMIT"

          echo
          echo "Verify baseline commit exists:"
          git cat-file -e "${BASELINE_COMMIT}^{commit}"

          echo
          echo "Verify current branch descends from baseline:"
          git merge-base --is-ancestor "$BASELINE_COMMIT" HEAD

          echo
          echo "Submodules:"
          git submodule status

          echo
          echo "Application-source changes relative to baseline:"
          git diff --stat "$BASELINE_COMMIT" -- . ':(exclude).github'

      - name: Install build dependencies from pinned Debian snapshot
        shell: bash
        run: |
          set -euxo pipefail

          # Use a historical Debian snapshot matching the era
          # of devkitpro/devkitarm:20241104.
          cat > /etc/apt/nerdmod-sources.list <<'EOF'
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20241104T000000Z/ bullseye main
          deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20241104T000000Z/ bullseye-security main
          EOF

          echo "=== nerdMod APT sources ==="
          cat /etc/apt/nerdmod-sources.list
          echo "============================"

          # Remove old package metadata baked into the container.
          rm -rf /var/lib/apt/lists/*
          apt-get clean

          # Force APT to use ONLY our historical source list.
          APT_ARGS=(
            -o Acquire::Check-Valid-Until=false
            -o Dir::Etc::sourcelist=/etc/apt/nerdmod-sources.list
            -o Dir::Etc::sourceparts=-
          )

          apt-get "${APT_ARGS[@]}" update

          DEBIAN_FRONTEND=noninteractive \
          apt-get "${APT_ARGS[@]}" install \
            -y \
            --no-install-recommends \
            p7zip-full \
            python \
            curl \
            ca-certificates

      - name: Download TWiLight manual pages
        shell: bash
        run: |
          set -euxo pipefail

          cd manual/nitrofiles

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --output pages.7z \
            https://github.com/DS-Homebrew/twilight-manual/releases/download/pages/pages.7z

          7z x -y pages.7z
          rm pages.7z

      - name: Show toolchain information
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== devkitARM ==="
          "${DEVKITARM}/bin/arm-none-eabi-gcc" --version || true

          echo
          echo "=== Python ==="
          python --version || true

          echo
          echo "=== 7-Zip ==="
          7z | head -n 4 || true

          echo
          echo "=== Git ==="
          git --version || true

      - name: Build nerdMod baseline
        shell: bash
        run: |
          set -euxo pipefail

          START_TIME=$(date +%s)

          make package 2>&1 | tee build.log

          END_TIME=$(date +%s)
          BUILD_SECONDS=$((END_TIME - START_TIME))

          echo "BUILD_SECONDS=$BUILD_SECONDS" >> "$GITHUB_ENV"

          echo
          echo "Build completed in ${BUILD_SECONDS} seconds."

      - name: Verify build output
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -d "7zfile" ]; then
            echo "ERROR: make package did not produce 7zfile/"
            exit 1
          fi

          echo "=== Generated BOOT.NDS / SRLDR files ==="

          find 7zfile \
            -type f \
            \( -name "*.srldr" -o -name "BOOT.NDS" \) \
            -exec stat --printf='%s bytes  %n\n' {} \; \
            | sort -k3

      - name: Generate SHA-256 hashes
        shell: bash
        run: |
          set -euxo pipefail

          find 7zfile \
            -type f \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > SHA256SUMS.txt

      - name: Count build warnings and errors
        if: always()
        shell: bash
        run: |
          set +e

          if [ -f build.log ]; then
            WARNINGS=$(grep -Eic 'warning:' build.log || true)
            ERRORS=$(grep -Eic 'error:' build.log || true)
          else
            WARNINGS="unknown"
            ERRORS="unknown"
          fi

          echo "WARNING_COUNT=$WARNINGS" >> "$GITHUB_ENV"
          echo "ERROR_COUNT=$ERRORS" >> "$GITHUB_ENV"

      - name: Create build summary
        if: always()
        shell: bash
        run: |
          {
            echo "# nerdMod baseline build"
            echo
            echo "## Source"
            echo
            echo "- Current commit: \`${GITHUB_SHA}\`"
            echo "- Baseline: \`${BASELINE_COMMIT}\`"
            echo "- Container: \`devkitpro/devkitarm:20241104\`"
            echo
            echo "## Build"
            echo
            echo "- Duration: \`${BUILD_SECONDS:-unknown} seconds\`"
            echo "- Warning count: \`${WARNING_COUNT:-unknown}\`"
            echo "- Error count: \`${ERROR_COUNT:-unknown}\`"
            echo
            echo "## Application source diff vs baseline"
            echo
            echo '```text'

            git diff --stat \
              "$BASELINE_COMMIT" \
              -- . ':(exclude).github' \
              || true

            echo '```'
            echo
            echo "## Important binaries"
            echo
            echo '```text'

            if [ -d 7zfile ]; then
              find 7zfile \
                -type f \
                \( -name "*.srldr" -o -name "BOOT.NDS" \) \
                -exec stat --printf='%s bytes  %n\n' {} \; \
                | sort -k3
            else
              echo "No 7zfile directory was produced."
            fi

            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish results as annotations
        if: always()
        shell: bash
        run: |
          set +e
          enc() { sed -e 's/%/%25/g' -e 's/\r//g' | sed -e 's/$/%0A/' | tr -d '\n'; }
          SIZES=$(find 7zfile -type f \( -name '*.srldr' -o -name 'BOOT.NDS' \) -exec stat --printf='%s %n\n' {} \; 2>/dev/null | sort -k2 | enc)
          echo "::notice title=binary-sizes::${SIZES}"
          # Toolchain probe (Phase 2C mic research): what the pinned libnds/calico headers say about the DSi microphone.
          PROBE=$( { grep -rniE 'MICEX|MIC_?CNT|MIC_?DATA|SNDEX|I2S|TWL.?MIC' /opt/devkitpro/libnds/include /opt/devkitpro/calico/include 2>/dev/null | sed -E 's#/opt/devkitpro/##' | head -120; } | enc)
          echo "::notice title=mic-probe::${PROBE:-none}"
          PROBE2=$( { ls /opt/devkitpro/libnds/include/nds/arm7 /opt/devkitpro/libnds/include/nds/arm9 2>/dev/null | tr '\n' ' '; ls /opt/devkitpro 2>/dev/null | tr '\n' ' '; } | enc)
          echo "::notice title=toolchain-dirs::${PROBE2:-none}"
          # Camera app: compiler messages from its own files, and header facts that decide how
          # it is launched (unit code, binary addresses, first ARM9 words).
          if [ -f build.log ]; then
            CAMW=$(grep -E '(^|/)camera/[^ ]*: *(warning|error)|photos\.cpp|aptina\.c' build.log | grep -E 'warning:|error:' | sed -E 's/^[^ ]*\/(camera\/[^ ]+): /\1: /' | sort | uniq -c | head -30 | enc)
            echo "::notice title=camera-warnings::${CAMW:-none}"
          fi
          # NDS header facts of the camera app next to two apps that are known to run in DSi mode
          hdr() {
            F="$1"
            [ -f "$F" ] || return
            rd32() { od -An -tx4 -j"$1" -N4 "$F" | tr -d ' '; }
            A9OFF=$((16#$(rd32 32))); A9ENT=$((16#$(rd32 36))); A9LOAD=$((16#$(rd32 40)))
            FIRST=$(od -An -tx4 -j$((A9OFF + A9ENT - A9LOAD)) -N16 "$F" | tr -s ' ')
            echo "$(basename "$F"): unitcode=0x$(od -An -tx1 -j18 -N1 "$F" | tr -d ' ') gamecode=$(dd if="$F" bs=1 skip=12 count=4 2>/dev/null) arm9load=0x$(rd32 40) arm9entry=0x$(rd32 36) arm9size=0x$(rd32 44) arm7load=0x$(rd32 56) arm7entry=0x$(rd32 52) arm7size=0x$(rd32 60) twlflags=0x$(od -An -tx1 -j447 -N1 "$F" | tr -d ' ') arm9ilen=0x$(rd32 460) arm7ilen=0x$(rd32 476) tidhi=0x$(rd32 572) arm9entry_words=${FIRST}"
          }
          CAMH=$( (hdr 7zfile/_nds/TWiLightMenu/camera.srldr; hdr 7zfile/Multimedia/_nds/TWiLightMenu/imageview.srldr; hdr 7zfile/_nds/TWiLightMenu/settings.srldr) | enc)
          echo "::notice title=camera-header::${CAMH}"
          echo "::notice title=build-stats::sha=${GITHUB_SHA} duration=${BUILD_SECONDS:-unknown}s warnings=${WARNING_COUNT:-unknown} errors=${ERROR_COUNT:-unknown}"
          if [ -f build.log ]; then
            WARNS=$(grep 'warning:' build.log | sed -E 's/^[^ ]*\/([^\/ ]+:[0-9]+:[0-9]+): /\1: /' | sort | uniq -c | sort -rn | head -25 | enc)
            echo "::notice title=distinct-warnings::${WARNS}"
            ERRS=$(grep -E 'error:|\*\*\* |Error [0-9]' build.log | head -25 | enc)
            if [ -n "$ERRS" ]; then
              echo "::notice title=error-lines::${ERRS}"
            fi
          fi
          exit 0

      - name: Short commit for the artifact name
        shell: bash
        run: echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Upload nerdMod build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nerdMod-phase2c-${{ env.SHORT_SHA }}
          path: |
            7zfile/
            SHA256SUMS.txt
            build.log
          if-no-files-found: error
          retention-days: 14
