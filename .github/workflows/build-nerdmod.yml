name: Build nerdMod

# Reproduces upstream TWiLight Menu++ CI (.github/workflows/nightly.yml):
# same pinned container, same extra packages, same manual-page download,
# same `make package`. Nothing is deployed anywhere.

on:
  workflow_dispatch:
  push:
    branches: ["nerdmod-dev"]
    paths-ignore:
      - 'README.md'

env:
  BASELINE_COMMIT: 68d04c1a621a8d330e7233efcfcb93c94b30a3a6

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    name: Build with devkitARM (pinned 20241104)
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install p7zip-full python -y

      - name: Setup environment
        run: |
          git config --global safe.directory '*'

      - name: Record toolchain and source state
        run: |
          {
            echo "## Build info"
            echo "- Commit: $(git rev-parse HEAD)"
            echo "- Branch/ref: ${GITHUB_REF_NAME}"
            echo "- Baseline commit: ${BASELINE_COMMIT}"
            echo "- Submodules:"
            git submodule status | sed 's/^/    /'
            echo "- arm-none-eabi-gcc: $(arm-none-eabi-gcc --version | head -n1)"
            echo "- DEVKITPRO=${DEVKITPRO} DEVKITARM=${DEVKITARM}"
            echo "- Changed application files vs baseline (excluding .github):"
            git diff --stat "${BASELINE_COMMIT}" HEAD -- . ':(exclude).github' | sed 's/^/    /'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          dkp-pacman -Q libnds libfat-nds maxmod-nds 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Get manual pages
        run: |
          cd manual/nitrofiles
          curl -LO https://github.com/DS-Homebrew/twilight-manual/releases/download/pages/pages.7z
          7z x pages.7z
          rm pages.7z

      - name: Build TWiLightMenu++
        run: |
          set -eo pipefail
          start=$(date +%s)
          make package 2>&1 | tee build.log
          echo "Build duration: $(( $(date +%s) - start )) s" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Warning/error summary and artifact sizes
        run: |
          {
            echo "## Build log counts"
            echo "- warnings: $(grep -ci 'warning:' build.log || true)"
            echo "- errors: $(grep -ci 'error:' build.log || true)"
            echo "## 7zfile contents (bytes)"
            echo '```'
            find 7zfile -type f \( -name '*.srldr' -o -iname 'BOOT.NDS' -o -name '*.nds' -o -name '*.dsi' -o -name '*.app' \) -printf '%s\t%p\n' | sort -k2
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          (cd 7zfile && find . -type f ! -name .gitkeep -exec sha256sum {} \; | sort -k2 > ../SHA256SUMS.txt)
          cp SHA256SUMS.txt build.log 7zfile/

      - name: Upload 7zfile artifact
        uses: actions/upload-artifact@v4
        with:
          name: nerdMod-baseline-v27.24.1
          path: 7zfile/
          if-no-files-found: error
